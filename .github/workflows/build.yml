# C8-650 ImmortalWrt 自动编译
# 基于GitHub Actions

name: Build C8-650 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: config/.config
  CUSTOM_FEEDS: feeds.conf.default
  CUSTOM_PACKAGES: luci-apps
  OUTPUT_DIR: bin/targets

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils \
          bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler ecj \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf \
          haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pip python3-ply qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
          
    - name: Clone Source
      run: |
        git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Copy Custom Packages
      run: |
        cp -r ${{ env.CUSTOM_PACKAGES }}/* openwrt/package/
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Load Config
      run: |
        cp ${{ env.CONFIG_FILE }} openwrt/.config
        cd openwrt
        make defconfig
        
    - name: Download Packages
      run: |
        cd openwrt
        make download -j8
        
    - name: Build Firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s
        
    - name: Upload Firmware
      uses: actions/upload-artifact@v3
      with:
        name: c8-650-firmware-${{ github.sha }}
        path: openwrt/${{ env.OUTPUT_DIR }}/*
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: openwrt/${{ env.OUTPUT_DIR }}/*
        tag_name: firmware-${{ github.sha }}
        name: C8-650 Firmware ${{ github.sha }}
        body: |
          ## C8-650 ImmortalWrt 固件
          
          基于 ImmortalWrt 23.05 编译
          
          ### 设备信息
          - 设备: 鲲鹏无限 C8-650
          - SoC: MediaTek MT7981
          - 5G模块: Quectel RM500U
          
          ### 使用方法
          1. 下载固件文件
          2. 通过SSH或U-Boot刷入
          3. 首次启动配置WiFi和网络
          
          ### 注意事项
          - 首次刷入会清除所有数据
          - 建议备份原有配置
          - 刷入后默认IP: 192.168.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
