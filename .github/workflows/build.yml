# C8-650 OpenWrt 自动编译
# 基于 GitHub Actions，使用 OpenWrt 官方源码

name: Build C8-650 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: main
  CONFIG_FILE: config/.config
  CUSTOM_PACKAGES: luci-apps
  OUTPUT_DIR: bin/targets

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h
        
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils \
          bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler ecj \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf \
          haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pip python3-ply qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
          
    - name: Clone Source Code
      run: |
        git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Copy Custom Packages
      run: |
        if [ -d "${{ env.CUSTOM_PACKAGES }}" ]; then
          cp -r ${{ env.CUSTOM_PACKAGES }}/* openwrt/package/
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        fi
        
    - name: Load Configuration
      run: |
        cp ${{ env.CONFIG_FILE }} openwrt/.config
        cd openwrt
        make defconfig
        
    - name: Download Packages
      run: |
        cd openwrt
        make download -j$(nproc)
        
    - name: Build Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        
    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt-C8-650-${{ github.sha }}
        path: openwrt/${{ env.OUTPUT_DIR }}/*
        
    - name: Generate Release Tag
      id: tag
      if: success() && github.event_name == 'push'
      run: |
        echo "release_tag=C8-650-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success() && github.event_name == 'push'
      with:
        files: openwrt/${{ env.OUTPUT_DIR }}/*
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: C8-650 Firmware ${{ steps.tag.outputs.release_tag }}
        body: |
          ## C8-650 OpenWrt 固件
          
          基于 OpenWrt 官方源码编译，支持 NRadio C8-668GL/C8-650
          
          ### 设备信息
          - 设备: 鲲鹏无限 C8-650 / C8-668
          - SoC: MediaTek MT7981 (Filogic 830)
          - 5G模块: Quectel RM500U / RM500Q
          
          ### 使用方法
          1. 下载固件文件
          2. 通过SSH或U-Boot刷入
          3. 首次启动配置WiFi和网络
          
          ### 注意事项
          - 首次刷入会清除所有数据
          - 建议备份原有配置
          - 刷入后默认IP: 192.168.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Notify Failure
      if: failure()
      run: |
        echo "::error::Build failed! Check the logs above for details."
